name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The three git dependencies live in private sibling repos, and a
      # workflow's default GITHUB_TOKEN is scoped to THIS repository only, so
      # it cannot read them. This needs a token with read access to the org's
      # repos, stored as the DEPS_READ_TOKEN secret.
      #
      # The insteadOf rewrite below only takes effect because
      # .cargo/config.toml sets `net.git-fetch-with-cli = true` — cargo's
      # default libgit2 transport ignores git's url.*.insteadOf rewriting
      # entirely, so it would silently keep trying the unauthenticated
      # https://github.com/... URL and fail with the opaque "could not read
      # Username" error this step exists to prevent. That coupling is
      # load-bearing: deleting `git-fetch-with-cli = true` from
      # .cargo/config.toml silently breaks this authentication fix, and
      # nothing here would catch it happening.
      #
      # A MISSING SECRET IS NOT AN ERROR. It was, while the dependencies were
      # private: no token meant no clone, and failing here gave a clear reason
      # instead of cargo's opaque one. Once they are public it is the opposite
      # — an anonymous clone is correct and refusing to build would be an
      # outage guarding nothing. So this step skips rather than fails, and the
      # notice below says exactly where the build will break if a dependency
      # is in fact still private. That keeps CI working across the switch,
      # without needing the secret's removal and the repos' publication to be
      # coordinated.
      - name: authenticate to the dependency repos, if they are still private
        env:
          DEPS_READ_TOKEN: ${{ secrets.DEPS_READ_TOKEN }}
        run: |
          if [ -z "${DEPS_READ_TOKEN}" ]; then
            echo "::notice::DEPS_READ_TOKEN is not set — cloning parallax,"
            echo "::notice::transit and occultation anonymously. That is correct"
            echo "::notice::once they are public. If any is still private, the"
            echo "::notice::build fails at the next cargo step with 'could not"
            echo "::notice::read Username'; set the secret to a fine-grained PAT"
            echo "::notice::with Contents: Read-only on the org's repos."
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${DEPS_READ_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

      # The audit tool must be able to audit the standard's own vectors. This
      # is the end-to-end check that the four layers compose.
      - name: audit every positive vector
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/fixtures/vectors/positive/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no positive vectors found; this step proved nothing"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "--- $f"
            set +e
            cargo run --quiet -- "$f"
            code=$?
            set -e
            # 0 and 1 are both real audits. 2 means we could not audit it.
            if [ "$code" -eq 2 ]; then
              echo "::error::$f could not be audited (exit 2)"
              exit 1
            fi
          done

      # The positive-vector step above never produces exit 2, so nothing
      # committed exercises the "could not audit this at all" branch. These
      # three negative vectors are malformed in ways layer 4 catches on its
      # own (a required claim missing, a float where the schema forbids one,
      # a duplicate JSON key) rather than ways that merely fail a residual
      # check, so this tool genuinely cannot audit them and must say so with
      # exit 2, not report DIVERGES/CANNOT HOLD on a record it never parsed.
      #
      # `[ "$code" -ne 2 ]` alone is a vacuous check: a renamed or deleted
      # fixture also makes `cargo run` exit 2 (an unreadable path), so the
      # step would report success identically whether the record was
      # correctly judged unauditable or simply wasn't found. Each path is
      # therefore verified to exist BEFORE being run, the same guard the
      # positive-vector step above applies via its own glob-emptiness check.
      - name: exit 2 is reachable on committed data, not only by reasoning
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            tests/fixtures/vectors/negative/missing-policy-bundle-hash.json \
            tests/fixtures/vectors/negative/float-timestamp.json \
            tests/fixtures/vectors/negative/duplicate-key.json \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist; this step would prove nothing (a missing"
              echo "::error::file also exits 2, vacuously satisfying the check below)"
              exit 1
            fi
            echo "--- $f"
            set +e
            cargo run --quiet -- "$f"
            code=$?
            set -e
            if [ "$code" -ne 2 ]; then
              echo "::error::$f was expected to exit 2 (unauditable input) but exited $code"
              exit 1
            fi
          done
